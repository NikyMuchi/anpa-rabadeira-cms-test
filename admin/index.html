<!DOCTYPE html>
<html lang="gl">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>ENTORNO DE PROBAS — CMS TEST | Panel de Administración</title>
  <link rel="icon" type="image/jpeg" href="/img/logo-anpa.jpg">
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    .sandbox-banner {
      flex-shrink: 0;
      background-color: #f59e0b;
      color: #78350f;
      font-weight: 700;
      font-size: 0.875rem;
      text-align: center;
      padding: 0.4rem 1rem;
      z-index: 999999;
      border-bottom: 2px solid #d97706;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .sandbox-banner__sep {
      color: #b45309;
      opacity: 0.7;
    }

    .sandbox-banner__link {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background-color: #78350f;
      color: #fffbeb;
      padding: 0.15rem 0.65rem;
      border-radius: 9999px;
      font-size: 0.8125rem;
      font-weight: 600;
      text-decoration: none;
      transition: background-color 0.15s ease;
    }

    .sandbox-banner__link:hover,
    .sandbox-banner__link:focus-visible {
      background-color: #451a03;
      color: #ffffff;
      outline: 2px solid #ffffff;
      outline-offset: 1px;
    }

    .sandbox-banner__icon {
      flex-shrink: 0;
    }

    #nc-root {
      flex: 1 1 auto;
      position: relative;
      height: 0;
      min-height: 0;
      overflow: hidden;
    }
  </style>
</head>

<body>
  <div class="sandbox-banner" role="alert">
    <span class="sandbox-banner__title">⚠️ ENTORNO DE PROBAS — CMS TEST (Sandbox de probas illada)</span>
    <span class="sandbox-banner__sep" aria-hidden="true">·</span>
    <a href="/admin/manual/" class="sandbox-banner__link" target="_blank" rel="noopener" aria-label="Abrir o Centro de Axuda e Manual de Administración nunha nova pestana">
      <svg class="sandbox-banner__icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
      📖 Centro de Axuda / Manual
    </a>
  </div>
  <div id="nc-root"></div>
  <!-- Decap CMS Core (Open-Source) -->
  <script src="https://unpkg.com/decap-cms@^3.1.0/dist/decap-cms.js"></script>
  <!-- Custom Preview Templates & Warm Theme Integration -->
  <script src="/admin/preview-templates.js"></script>
</body>

</html>
